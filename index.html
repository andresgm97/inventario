<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario de Urgencias</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B1B1E'/%3E%3Cpath d='M14 40C22 24 28 20 32 30C36 20 44 22 50 36' stroke='%23F15E28' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #f3f1ed;
    --bg-inset: #eae7e1;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --border: #e2ddd4;
    --border-strong: #d2cbbf;
    --text: #24221f;
    --text-muted: #6f6a62;
    --text-faint: #a19a8d;

    --accent: #f15e28;
    --accent-hover: #d24d1c;
    --accent-soft: #fce3d7;
    --accent-contrast: #fff8f4;

    --success: #1f7a45;
    --success-soft: #dcf1e3;
    --warning: #92660b;
    --warning-soft: #f8ecce;
    --danger: #b5271f;
    --danger-soft: #f9e0dd;

    --shadow-sm: 0 1px 2px rgba(36, 34, 31, 0.06);
    --shadow-md: 0 8px 24px -8px rgba(36, 34, 31, 0.18);
    --shadow-lg: 0 20px 50px -12px rgba(36, 34, 31, 0.32);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;

    --font-display: 'Archivo', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #19181a;
      --bg-inset: #121112;
      --surface: #211f21;
      --surface-raised: #28262a;
      --border: #38353a;
      --border-strong: #48454b;
      --text: #f2efe9;
      --text-muted: #a8a29a;
      --text-faint: #726c65;

      --accent: #ff7040;
      --accent-hover: #ff8c5f;
      --accent-soft: rgba(255, 112, 64, 0.18);
      --accent-contrast: #221204;

      --success: #4fd88a;
      --success-soft: rgba(79, 216, 138, 0.14);
      --warning: #f2c14e;
      --warning-soft: rgba(242, 193, 78, 0.14);
      --danger: #f27a72;
      --danger-soft: rgba(242, 122, 114, 0.14);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 24px 60px -16px rgba(0, 0, 0, 0.65);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

  body {
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    text-wrap: balance;
    margin: 0;
  }

  ::selection { background: var(--accent-soft); color: var(--accent-hover); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .shell {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 32px 72px;
  }

  /* ---------- header / brand ---------- */

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding-bottom: 22px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 16px; }

  .brand-logo-plate {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    background: #ffffff;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }

  .brand-logo { width: 152px; height: auto; display: block; }
  .brand-logo .logo-mark { fill: #f15e28; }
  .brand-logo .logo-word { fill: #4c4c4c; }
  .brand-logo .logo-cutout { fill: #ffffff; }

  .brand-text-block { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }

  .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .print-header { display: none; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .print-header {
      display: block;
      margin-bottom: 16px;
    }
    .print-header h1 { font-size: 18px; margin: 0 0 2px; }
    .print-header p { margin: 0; color: #555; font-size: 12px; }
    .shell { padding: 0; max-width: none; }
    .table-wrap { border: none; box-shadow: none; }
    .inventory-table th:last-child, .inventory-table td:last-child { display: none; }
    .inventory-table { font-size: 11px; }
    .summary-cards { margin-bottom: 12px; }
    .summary-card { box-shadow: none; }
  }

  .brand-product {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  /* ---------- buttons ---------- */

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
  }

  .btn svg { flex-shrink: 0; }

  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: transparent;
    border-color: var(--border-strong);
    color: var(--text);
  }

  .btn-secondary:hover { background: var(--bg-inset); }

  .btn-danger {
    background: transparent;
    border-color: var(--danger-soft);
    color: var(--danger);
  }

  .btn-danger:hover { background: var(--danger-soft); }

  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-small { padding: 6px 12px; font-size: 12.5px; border-radius: 7px; }

  /* ---------- summary strip ---------- */

  .summary-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }

  .summary-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: inherit;
    text-align: left;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .summary-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--border-strong);
  }

  .summary-card.tone-warning::before { background: var(--warning); }
  .summary-card.tone-danger::before { background: var(--danger); }
  .summary-card.tone-accent::before { background: var(--accent); }

  button.summary-card { cursor: pointer; }

  button.summary-card.active {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
  }

  .summary-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .summary-card.tone-warning .summary-value { color: var(--warning); }
  .summary-card.tone-danger .summary-value { color: var(--danger); }

  .summary-label {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  /* ---------- toolbar ---------- */

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search-input { flex: 1; min-width: 220px; }

  .toolbar input, .toolbar select {
    padding: 10px 13px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }

  .toolbar input::placeholder { color: var(--text-faint); }

  /* ---------- table ---------- */

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: auto;
    box-shadow: var(--shadow-sm);
  }

  .inventory-table { width: 100%; border-collapse: collapse; font-size: 14px; }

  .inventory-table th {
    text-align: left;
    padding: 13px 16px;
    background: var(--bg-inset);
    color: var(--text-muted);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  .inventory-table td {
    padding: 13px 16px;
    border-top: 1px solid var(--border);
    vertical-align: top;
  }

  .inventory-table tbody tr { transition: background 0.1s ease; }
  .inventory-table tbody tr:hover { background: var(--bg-inset); }

  .cell-title { font-weight: 700; }
  .cell-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .badge-medicacion { background: var(--accent-soft); color: var(--accent-hover); }
  .badge-material { background: var(--bg-inset); color: var(--text-muted); border: 1px solid var(--border-strong); }

  .stock-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .stock-agotado { color: var(--danger); }
  .stock-bajo { color: var(--warning); }
  .stock-ok { color: var(--text); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
    white-space: nowrap;
  }

  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .status-pill.tone-danger { background: var(--danger-soft); color: var(--danger); }
  .status-pill.tone-danger .status-dot { background: var(--danger); }
  .status-pill.tone-warning { background: var(--warning-soft); color: var(--warning); }
  .status-pill.tone-warning .status-dot { background: var(--warning); }
  .status-pill.tone-ok { background: var(--success-soft); color: var(--success); }
  .status-pill.tone-ok .status-dot { background: var(--success); }
  .status-pill.tone-neutral { color: var(--text-faint); }
  .status-pill.tone-neutral .status-dot { background: var(--text-faint); }

  .expiry-date {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

  .empty-state { text-align: center; color: var(--text-muted); padding: 48px 0; }

  .error-text { color: var(--danger); font-size: 13px; margin: 4px 0; font-weight: 600; }

  .storage-warning {
    background: var(--warning-soft);
    color: var(--warning);
    border: 1px solid var(--warning);
    border-radius: var(--radius-sm);
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  /* ---------- modals ---------- */

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 16, 0.5);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }

  .modal {
    background: var(--surface-raised);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 26px 28px;
    width: 560px;
    max-width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }

  .modal-narrow { width: 400px; }

  .modal h2 { font-size: 18px; margin-bottom: 6px; }

  .modal-subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 18px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field input, .field select, .field textarea {
    font-family: var(--font-body);
    text-transform: none;
    letter-spacing: normal;
    font-weight: 400;
    font-size: 14.5px;
    color: var(--text);
    background: var(--bg);
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
  }

  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .field-wide { grid-column: 1 / -1; }

  .modal-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
  }

  .toggle-group { grid-column: 1 / -1; display: flex; gap: 8px; }

  .toggle-btn {
    flex: 1;
    padding: 11px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .toggle-btn.active.retirar { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .toggle-btn.active.reponer { background: var(--success-soft); border-color: var(--success); color: var(--success); }

  @media (max-width: 720px) {
    .shell { padding: 18px; }
    .summary-cards { grid-template-columns: repeat(2, 1fr); }
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ---------- selector de sala ---------- */

  .sala-shell {
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }

  .sala-shell .brand-logo-plate { margin-bottom: 28px; }

  .sala-shell h1 {
    font-size: 26px;
    margin-bottom: 6px;
  }

  .sala-shell .sala-subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0 0 40px;
  }

  .sala-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
  }

  .sala-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 28px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
  }

  .sala-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }

  .sala-card:active { transform: translateY(1px); }

  .sala-card-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .sala-card h2 {
    font-size: 18px;
    margin: 0;
  }

  .sala-card p {
    margin: 0;
    color: var(--text-muted);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .sala-card-count {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
  }

  .cambiar-sala {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .cambiar-sala:hover { color: var(--accent); }

  @media (max-width: 640px) {
    .sala-grid { grid-template-columns: 1fr; }
    .sala-shell { padding: 40px 20px; }
  }
</style>
</head>

  // ---------- utilidades ----------

  function uid() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function diasHastaCaducidad(caducidad) {
    if (!caducidad) return null;
    var hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    var fecha = new Date(caducidad + 'T00:00:00');
    if (isNaN(fecha.getTime())) return null;
    return Math.round((fecha.getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24));
  }

  function estadoCaducidad(caducidad) {
    var dias = diasHastaCaducidad(caducidad);
    if (dias === null) return 'sin-fecha';
    if (dias < 0) return 'caducado';
    if (dias <= DIAS_AVISO) return 'proximo';
    return 'ok';
  }

  function estadoStock(stock, stockMinimo) {
    if (stock <= 0) return 'agotado';
    if (stockMinimo > 0 && stock <= stockMinimo) return 'bajo';
    return 'ok';
  }

  function formatFecha(fecha) {
    if (!fecha) return '—';
    var partes = fecha.split('-');
    return partes[2] + '/' + partes[1] + '/' + partes[0];
  }

  function textoCaducidad(fecha) {
    var dias = diasHastaCaducidad(fecha);
    if (dias === null) return '';
    if (dias < 0) return 'Caducado hace ' + Math.abs(dias) + ' días';
    if (dias === 0) return 'Caduca hoy';
    return 'Caduca en ' + dias + ' días';
  }

  function pillCaducidad(estado) {
    if (estado === 'caducado') return { tone: 'tone-danger', texto: 'Caducado' };
    if (estado === 'proximo') return { tone: 'tone-warning', texto: 'Próximo' };
    if (estado === 'ok') return { tone: 'tone-ok', texto: 'Correcto' };
    return { tone: 'tone-neutral', texto: 'Sin fecha' };
  }

  function pillStock(estado) {
    if (estado === 'agotado') return { tone: 'tone-danger', texto: 'Agotado' };
    if (estado === 'bajo') return { tone: 'tone-warning', texto: 'Stock bajo' };
    return { tone: 'tone-ok', texto: 'Correcto' };
  }

  // ---------- acciones ----------

  function crearItem(datos) {
    var nuevo = Object.assign({}, datos, { id: uid(), actualizadoEn: new Date().toISOString() });
    state.items.push(nuevo);
    state.modal = null;
    guardarYRenderizar();
  }

  function editarItem(id, datos) {
    var idx = state.items.findIndex(function (i) { return i.id === id; });
    if (idx === -1) return;
    state.items[idx] = Object.assign({}, state.items[idx], datos, { actualizadoEn: new Date().toISOString() });
    state.modal = null;
    guardarYRenderizar();
  }

  function ajustarStock(id, delta) {
    var idx = state.items.findIndex(function (i) { return i.id === id; });
    if (idx === -1) return;
    var item = state.items[idx];
    var nuevoStock = Math.max(0, item.stock + delta);
    state.items[idx] = Object.assign({}, item, { stock: nuevoStock, actualizadoEn: new Date().toISOString() });
    state.modal = null;
    guardarYRenderizar();
  }

  function eliminarItem(id) {
    state.items = state.items.filter(function (i) { return i.id !== id; });
    state.modal = null;
    guardarYRenderizar();
  }

  // ---------- exportar / importar ----------

  var CSV_COLUMNAS = ['nombre', 'categoria', 'presentacion', 'unidad', 'stock', 'stockMinimo', 'lote', 'caducidad', 'ubicacion', 'notas'];
  var CSV_CABECERAS = ['Nombre', 'Categoría', 'Presentación', 'Unidad', 'Stock', 'Stock mínimo', 'Lote', 'Caducidad (AAAA-MM-DD)', 'Ubicación', 'Notas'];

  function categoriaALabel(categoria) {
    return categoria === 'material' ? 'Material' : 'Medicación';
  }

  function labelACategoria(valor) {
    return String(valor || '').trim().toLowerCase().indexOf('material') === 0 ? 'material' : 'medicacion';
  }

  function csvEscape(valor) {
    var texto = String(valor == null ? '' : valor);
    if (/[",\n\r]/.test(texto)) {
      return '"' + texto.replace(/"/g, '""') + '"';
    }
    return texto;
  }

  function itemsToCSV(items) {
    var filas = [CSV_CABECERAS.join(',')];
    items.forEach(function (item) {
      var fila = [
        item.nombre,
        categoriaALabel(item.categoria),
        item.presentacion,
        item.unidad,
        item.stock,
        item.stockMinimo,
        item.lote,
        item.caducidad,
        item.ubicacion,
        item.notas
      ].map(csvEscape);
      filas.push(fila.join(','));
    });
    return '﻿' + filas.join('\r\n') + '\r\n';
  }

  function parseCSV(texto) {
    var filas = [];
    var fila = [];
    var campo = '';
    var dentroComillas = false;
    for (var i = 0; i < texto.length; i++) {
      var c = texto[i];
      if (dentroComillas) {
        if (c === '"') {
          if (texto[i + 1] === '"') { campo += '"'; i++; }
          else { dentroComillas = false; }
        } else {
          campo += c;
        }
      } else if (c === '"') {
        dentroComillas = true;
      } else if (c === ',') {
        fila.push(campo);
        campo = '';
      } else if (c === '\r') {
        // ignorar, el salto real lo marca \n
      } else if (c === '\n') {
        fila.push(campo);
        filas.push(fila);
        fila = [];
        campo = '';
      } else {
        campo += c;
      }
    }
    if (campo !== '' || fila.length > 0) {
      fila.push(campo);
      filas.push(fila);
    }
    return filas.filter(function (f) { return !(f.length === 1 && f[0].trim() === ''); });
  }

  function csvFilasAItems(filas) {
    if (filas.length < 1) return null;
    var cabecera = filas[0].map(function (h) { return h.trim().toLowerCase(); });
    var tieneNombre = cabecera.some(function (h) { return h.indexOf('nombre') !== -1; });
    var tieneStock = cabecera.some(function (h) { return h.indexOf('stock') !== -1; });
    if (!tieneNombre || !tieneStock) return null;

    var now = new Date().toISOString();
    var items = [];
    for (var i = 1; i < filas.length; i++) {
      var f = filas[i];
      if (!f[0] || !f[0].trim()) continue;
      items.push({
        id: uid(),
        nombre: (f[0] || '').trim(),
        categoria: labelACategoria(f[1]),
        presentacion: (f[2] || '').trim(),
        unidad: (f[3] || '').trim() || 'unidades',
        stock: Math.max(0, Number(f[4]) || 0),
        stockMinimo: Math.max(0, Number(f[5]) || 0),
        lote: (f[6] || '').trim(),
        caducidad: (f[7] || '').trim(),
        ubicacion: (f[8] || '').trim(),
        notas: (f[9] || '').trim(),
        actualizadoEn: now
      });
    }
    return items;
  }

  function descargarArchivo(nombre, contenido, tipoMime) {
    var blob = new Blob([contenido], { type: tipoMime });
    var url = URL.createObjectURL(blob);
    var enlace = document.createElement('a');
    enlace.href = url;
    enlace.download = nombre;
    document.body.appendChild(enlace);
    enlace.click();
    document.body.removeChild(enlace);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // ---------- render ----------

  function itemsFiltrados() {
    var texto = state.busqueda.trim().toLowerCase();
    return state.items
      .filter(function (item) { return state.filtroCategoria === 'todas' || item.categoria === state.filtroCategoria; })
      .filter(function (item) {
        if (state.filtroEstado === 'todos') return true;
        if (state.filtroEstado === 'caducados') return estadoCaducidad(item.caducidad) === 'caducado';
        if (state.filtroEstado === 'proximos') return estadoCaducidad(item.caducidad) === 'proximo';
        if (state.filtroEstado === 'bajo-stock') return estadoStock(item.stock, item.stockMinimo) !== 'ok';
        return true;
      })
      .filter(function (item) {
        if (!texto) return true;
        return (
          item.nombre.toLowerCase().indexOf(texto) !== -1 ||
          item.presentacion.toLowerCase().indexOf(texto) !== -1 ||
          item.ubicacion.toLowerCase().indexOf(texto) !== -1 ||
          item.lote.toLowerCase().indexOf(texto) !== -1
        );
      })
      .sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); });
  }

  function renderHeader() {
    var sala = SALAS[state.sala];
    return (
      '<header class="app-header no-print">' +
      '<div class="brand">' +
      '<div class="brand-logo-plate">' + LOGO_LOCKUP + '</div>' +
      '<div class="brand-text-block">' +
      '<span class="brand-product">Inventario<br>' + escapeHtml(sala.nombre) + '</span>' +
      '<button class="cambiar-sala" onclick="App.cambiarSala()">Cambiar de sala</button>' +
      '</div></div>' +
      '<div class="header-actions no-print">' +
      '<input type="file" id="f-importar" accept=".csv,text/csv" class="visually-hidden" onchange="App.manejarImportacion(event)" />' +
      '<button class="btn btn-secondary btn-small" onclick="App.abrirImportar()">' + ICON_IMPORT + ' Importar</button>' +
      '<button class="btn btn-secondary btn-small" onclick="App.exportarExcel()">' + ICON_EXPORT + ' Excel</button>' +
      '<button class="btn btn-secondary btn-small" onclick="App.exportarPDF()">' + ICON_EXPORT + ' PDF</button>' +
      '<button class="btn btn-primary" onclick="App.abrirNuevo()">' + ICON_PLUS + ' Nuevo producto</button>' +
      '</div>' +
      '</header>'
    );
  }

  function renderSelectorSala() {
    var tarjetas = Object.keys(SALAS).map(function (key) {
      var sala = SALAS[key];
      var count = contarProductos(sala);
      return (
        '<button class="sala-card" onclick="App.seleccionarSala(\'' + sala.id + '\')">' +
        '<span class="sala-card-icon">' + sala.icono + '</span>' +
        '<h2>' + escapeHtml(sala.nombre) + '</h2>' +
        '<p>' + escapeHtml(sala.descripcion) + '</p>' +
        (count !== null ? '<span class="sala-card-count">' + count + ' producto' + (count === 1 ? '' : 's') + '</span>' : '') +
        '</button>'
      );
    }).join('');

    return (
      '<div class="sala-shell">' +
      '<div class="brand-logo-plate">' + LOGO_LOCKUP + '</div>' +
      '<h1>¿En qué sala vas a trabajar?</h1>' +
      '<p class="sala-subtitle">Cada sala tiene su propio inventario, independiente del resto.</p>' +
      '<div class="sala-grid">' + tarjetas + '</div>' +
      '</div>'
    );
  }

  function renderResumen() {
    var caducados = state.items.filter(function (i) { return estadoCaducidad(i.caducidad) === 'caducado'; }).length;
    var proximos = state.items.filter(function (i) { return estadoCaducidad(i.caducidad) === 'proximo'; }).length;
    var bajoStock = state.items.filter(function (i) { return estadoStock(i.stock, i.stockMinimo) !== 'ok'; }).length;

    function tarjetaFiltro(valor, tono, valorLabel, label) {
      var activo = state.filtroEstado === valor;
      return '<button class="summary-card ' + tono + ' ' + (activo ? 'active' : '') + '" onclick="App.toggleFiltroEstado(\'' + valor + '\')">' +
        '<span class="summary-value">' + valorLabel + '</span>' +
        '<span class="summary-label">' + label + '</span></button>';
    }

    return (
      '<section class="summary-cards">' +
      '<div class="summary-card"><span class="summary-value">' + state.items.length + '</span><span class="summary-label">Productos en inventario</span></div>' +
      tarjetaFiltro('bajo-stock', 'tone-warning', bajoStock, 'Stock bajo o agotado') +
      tarjetaFiltro('proximos', 'tone-warning', proximos, 'Próximos a caducar') +
      tarjetaFiltro('caducados', 'tone-danger', caducados, 'Caducados') +
      '</section>'
    );
  }

  function renderToolbar() {
    return (
      '<section class="toolbar no-print">' +
      '<input type="search" class="search-input" placeholder="Buscar por nombre, presentación, ubicación o lote…" value="' + escapeHtml(state.busqueda) + '" oninput="App.setBusqueda(this.value)" />' +
      '<select onchange="App.setFiltroCategoria(this.value)">' +
      '<option value="todas"' + (state.filtroCategoria === 'todas' ? ' selected' : '') + '>Todas las categorías</option>' +
      '<option value="medicacion"' + (state.filtroCategoria === 'medicacion' ? ' selected' : '') + '>Medicación</option>' +
      '<option value="material"' + (state.filtroCategoria === 'material' ? ' selected' : '') + '>Material</option>' +
      '</select>' +
      '<select onchange="App.setFiltroEstado(this.value)">' +
      '<option value="todos"' + (state.filtroEstado === 'todos' ? ' selected' : '') + '>Todos los estados</option>' +
      '<option value="bajo-stock"' + (state.filtroEstado === 'bajo-stock' ? ' selected' : '') + '>Stock bajo o agotado</option>' +
      '<option value="proximos"' + (state.filtroEstado === 'proximos' ? ' selected' : '') + '>Próximos a caducar</option>' +
      '<option value="caducados"' + (state.filtroEstado === 'caducados' ? ' selected' : '') + '>Caducados</option>' +
      '</select>' +
      '</section>'
    );
  }

  function renderTabla() {
    var items = itemsFiltrados();
    if (items.length === 0) {
      return '<p class="empty-state">No hay productos que coincidan con el filtro.</p>';
    }
    var filas = items.map(function (item) {
      var eCaducidad = estadoCaducidad(item.caducidad);
      var eStock = estadoStock(item.stock, item.stockMinimo);
      var pillC = pillCaducidad(eCaducidad);
      var pillS = pillStock(eStock);
      return (
        '<tr>' +
        '<td><div class="cell-title">' + escapeHtml(item.nombre) + '</div>' +
        (item.presentacion ? '<div class="cell-subtitle">' + escapeHtml(item.presentacion) + '</div>' : '') +
        (item.lote ? '<div class="cell-subtitle">Lote: ' + escapeHtml(item.lote) + '</div>' : '') +
        '</td>' +
        '<td><span class="badge badge-' + item.categoria + '">' + (item.categoria === 'medicacion' ? 'Medicación' : 'Material') + '</span></td>' +
        '<td><div class="stock-value stock-' + eStock + '">' + item.stock + ' ' + escapeHtml(item.unidad) + '</div>' +
        '<span class="status-pill ' + pillS.tone + '"><span class="status-dot"></span>' + pillS.texto + '</span>' +
        '</td>' +
        '<td><span class="status-pill ' + pillC.tone + '"><span class="status-dot"></span>' + pillC.texto + '</span>' +
        (item.caducidad ? '<div class="expiry-date">' + formatFecha(item.caducidad) + ' · ' + textoCaducidad(item.caducidad) + '</div>' : '') +
        '</td>' +
        '<td>' + (escapeHtml(item.ubicacion) || '—') + '</td>' +
        '<td class="actions-cell">' +
        '<button class="btn btn-small" onclick="App.abrirAjustar(\'' + item.id + '\')">Ajustar stock</button>' +
        '<button class="btn btn-small btn-secondary" onclick="App.abrirEditar(\'' + item.id + '\')">Editar</button>' +
        '<button class="btn btn-small btn-danger" onclick="App.abrirEliminar(\'' + item.id + '\')">Eliminar</button>' +
        '</td>' +
        '</tr>'
      );
    }).join('');

    return (
      '<div class="table-wrap"><table class="inventory-table"><thead><tr>' +
      '<th>Producto</th><th>Categoría</th><th>Stock</th><th>Caducidad</th><th>Ubicación</th><th>Acciones</th>' +
      '</tr></thead><tbody>' + filas + '</tbody></table></div>'
    );
  }

  function campoTexto(id, label, valor, tipo, extra) {
    tipo = tipo || 'text';
    return (
      '<label class="field' + (extra && extra.wide ? ' field-wide' : '') + '">' + label +
      '<input type="' + tipo + '" id="' + id + '" value="' + escapeHtml(valor) + '"' +
      (extra && extra.min !== undefined ? ' min="' + extra.min + '"' : '') +
      (extra && extra.autofocus ? ' autofocus' : '') + ' /></label>'
    );
  }

  function renderModal() {
    if (!state.modal) return '';
    var modal = state.modal;

    if (modal.tipo === 'nuevo' || modal.tipo === 'editar') {
      var item = modal.tipo === 'editar' ? state.items.find(function (i) { return i.id === modal.itemId; }) : null;
      var d = item || { nombre: '', categoria: 'medicacion', presentacion: '', unidad: 'unidades', stock: 0, stockMinimo: 0, lote: '', caducidad: '', ubicacion: '', notas: '' };
      return (
        '<div class="modal-backdrop">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
        '<h2>' + (item ? 'Editar producto' : 'Nuevo producto') + '</h2>' +
        '<form class="form-grid" onsubmit="return App.guardarFormulario(event)">' +
        campoTexto('f-nombre', 'Nombre *', d.nombre, 'text', { wide: true, autofocus: true }) +
        '<label class="field">Categoría<select id="f-categoria">' +
        '<option value="medicacion"' + (d.categoria === 'medicacion' ? ' selected' : '') + '>Medicación</option>' +
        '<option value="material"' + (d.categoria === 'material' ? ' selected' : '') + '>Material</option>' +
        '</select></label>' +
        campoTexto('f-presentacion', 'Presentación', d.presentacion) +
        campoTexto('f-unidad', 'Unidad', d.unidad) +
        campoTexto('f-stock', 'Stock actual', d.stock, 'number', { min: 0 }) +
        campoTexto('f-stockMinimo', 'Stock mínimo (aviso)', d.stockMinimo, 'number', { min: 0 }) +
        campoTexto('f-caducidad', 'Fecha de caducidad', d.caducidad, 'date') +
        campoTexto('f-lote', 'Lote', d.lote) +
        campoTexto('f-ubicacion', 'Ubicación', d.ubicacion) +
        '<label class="field field-wide">Notas<textarea id="f-notas" rows="2">' + escapeHtml(d.notas) + '</textarea></label>' +
        (modal.error ? '<p class="error-text field-wide">' + escapeHtml(modal.error) + '</p>' : '') +
        '<div class="modal-actions">' +
        '<button type="button" class="btn btn-secondary" onclick="App.cerrarModal()">Cancelar</button>' +
        '<button type="submit" class="btn btn-primary">Guardar</button>' +
        '</div></form></div></div>'
      );
    }

    if (modal.tipo === 'ajustar') {
      var itemAj = state.items.find(function (i) { return i.id === modal.itemId; });
      if (!itemAj) return '';
      var modoActual = modal.modo || 'retirar';
      var cantidad = modal.cantidad != null ? modal.cantidad : 1;
      var resultante = modoActual === 'retirar' ? itemAj.stock - cantidad : itemAj.stock + cantidad;
      return (
        '<div class="modal-backdrop">' +
        '<div class="modal modal-narrow" onclick="event.stopPropagation()">' +
        '<h2>Ajustar stock</h2>' +
        '<p class="modal-subtitle">' + escapeHtml(itemAj.nombre) + ' · stock actual: <strong>' + itemAj.stock + '</strong> ' + escapeHtml(itemAj.unidad) + '</p>' +
        '<form class="form-grid" onsubmit="return App.confirmarAjuste(event)">' +
        '<div class="toggle-group">' +
        '<button type="button" class="toggle-btn ' + (modoActual === 'retirar' ? 'active retirar' : '') + '" onclick="App.setModoAjuste(\'retirar\')">Retirar</button>' +
        '<button type="button" class="toggle-btn ' + (modoActual === 'reponer' ? 'active reponer' : '') + '" onclick="App.setModoAjuste(\'reponer\')">Reponer</button>' +
        '</div>' +
        '<label class="field field-wide">Cantidad<input type="number" min="1" id="f-cantidad" value="' + cantidad + '" oninput="App.setCantidadAjuste(this.value)" autofocus /></label>' +
        '<p class="modal-subtitle field-wide">Stock resultante: <strong>' + Math.max(0, resultante) + '</strong> ' + escapeHtml(itemAj.unidad) + '</p>' +
        (modal.error ? '<p class="error-text field-wide">' + escapeHtml(modal.error) + '</p>' : '') +
        '<div class="modal-actions">' +
        '<button type="button" class="btn btn-secondary" onclick="App.cerrarModal()">Cancelar</button>' +
        '<button type="submit" class="btn btn-primary">Confirmar</button>' +
        '</div></form></div></div>'
      );
    }

    if (modal.tipo === 'eliminar') {
      var itemEl = state.items.find(function (i) { return i.id === modal.itemId; });
      if (!itemEl) return '';
      return (
        '<div class="modal-backdrop">' +
        '<div class="modal modal-narrow" onclick="event.stopPropagation()">' +
        '<h2>Eliminar producto</h2>' +
        '<p class="modal-subtitle">¿Seguro que quieres eliminar "' + escapeHtml(itemEl.nombre) + '" del inventario? Esta acción no se puede deshacer.</p>' +
        '<div class="modal-actions">' +
        '<button class="btn btn-secondary" onclick="App.cerrarModal()">Cancelar</button>' +
        '<button class="btn btn-danger" onclick="App.confirmarEliminar()">Eliminar</button>' +
        '</div></div></div>'
      );
    }

    return '';
  }

  function render() {
    var root = document.getElementById('root');

    if (!state.sala) {
      root.innerHTML = renderSelectorSala();
      return;
    }

    var sala = SALAS[state.sala];
    var fechaImpresion = new Date().toLocaleString('es-ES');

    root.innerHTML =
      '<div class="shell">' +
      renderHeader() +
      '<div class="print-header"><h1>Inventario · ' + escapeHtml(sala.nombre) + '</h1><p>ArcelorMittal · Servicios Médicos · Generado el ' + fechaImpresion + '</p></div>' +
      (storageDisponible ? '' : '<div class="storage-warning">El navegador no permite guardar datos de forma persistente (modo privado o almacenamiento bloqueado). Los cambios se perderán al cerrar esta pestaña.</div>') +
      renderResumen() +
      renderToolbar() +
      renderTabla() +
      '</div>' +
      renderModal();
  }

  // ---------- API pública (usada desde los atributos onclick del HTML) ----------

  var App = {
    seleccionarSala: function (salaId) {
      var sala = SALAS[salaId];
      if (!sala) return;
      state.sala = salaId;
      state.items = cargarItems(sala);
      state.busqueda = '';
      state.filtroCategoria = 'todas';
      state.filtroEstado = 'todos';
      state.modal = null;
      render();
    },
    cambiarSala: function () {
      state.sala = null;
      state.items = [];
      state.modal = null;
      render();
    },

    exportarExcel: function () {
      var sala = SALAS[state.sala];
      var csv = itemsToCSV(state.items);
      var fecha = new Date().toISOString().slice(0, 10);
      descargarArchivo('inventario-' + sala.id + '-' + fecha + '.csv', csv, 'text/csv;charset=utf-8');
    },

    exportarPDF: function () {
      window.print();
    },

    abrirImportar: function () {
      document.getElementById('f-importar').click();
    },

    manejarImportacion: function (event) {
      var input = event.target;
      var file = input.files && input.files[0];
      if (!file) return;
      var sala = SALAS[state.sala];
      var lector = new FileReader();
      lector.onload = function () {
        var filas = parseCSV(String(lector.result));
        var items = csvFilasAItems(filas);
        if (!items) {
          window.alert('El archivo no tiene el formato esperado. Usa un archivo exportado desde esta misma app ("Excel").');
          input.value = '';
          return;
        }
        var confirmado = window.confirm(
          'Se va a REEMPLAZAR todo el inventario actual de "' + sala.nombre + '" (' + state.items.length + ' productos) ' +
          'por los ' + items.length + ' productos del archivo importado. Esta acción no se puede deshacer. ¿Continuar?'
        );
        input.value = '';
        if (!confirmado) return;
        state.items = items;
        state.modal = null;
        guardarYRenderizar();
      };
      lector.onerror = function () {
        window.alert('No se pudo leer el archivo.');
      };
      lector.readAsText(file, 'utf-8');
    },

    setBusqueda: function (valor) {
      state.busqueda = valor;
      render();
      var input = document.querySelector('.search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    },
    setFiltroCategoria: function (valor) { state.filtroCategoria = valor; render(); },
    setFiltroEstado: function (valor) { state.filtroEstado = valor; render(); },
    toggleFiltroEstado: function (valor) {
      state.filtroEstado = state.filtroEstado === valor ? 'todos' : valor;
      render();
    },
    abrirNuevo: function () { state.modal = { tipo: 'nuevo' }; render(); },
    abrirEditar: function (id) { state.modal = { tipo: 'editar', itemId: id }; render(); },
    abrirAjustar: function (id) { state.modal = { tipo: 'ajustar', itemId: id, modo: 'retirar', cantidad: 1 }; render(); },
    abrirEliminar: function (id) { state.modal = { tipo: 'eliminar', itemId: id }; render(); },
    cerrarModal: function (event) {
      if (event && event.target !== event.currentTarget) return;
      state.modal = null;
      render();
    },
    setModoAjuste: function (modo) { state.modal.modo = modo; render(); },
    setCantidadAjuste: function (valor) { state.modal.cantidad = Number(valor); },

    guardarFormulario: function (event) {
      event.preventDefault();
      var datos = {
        nombre: document.getElementById('f-nombre').value.trim(),
        categoria: document.getElementById('f-categoria').value,
        presentacion: document.getElementById('f-presentacion').value.trim(),
        unidad: document.getElementById('f-unidad').value.trim() || 'unidades',
        stock: Number(document.getElementById('f-stock').value),
        stockMinimo: Number(document.getElementById('f-stockMinimo').value),
        caducidad: document.getElementById('f-caducidad').value,
        lote: document.getElementById('f-lote').value.trim(),
        ubicacion: document.getElementById('f-ubicacion').value.trim(),
        notas: document.getElementById('f-notas').value.trim()
      };
      if (!datos.nombre) {
        state.modal.error = 'El nombre es obligatorio.';
        render();
        return false;
      }
      if (datos.stock < 0) {
        state.modal.error = 'El stock no puede ser negativo.';
        render();
        return false;
      }
      if (state.modal.tipo === 'nuevo') {
        crearItem(datos);
      } else {
        editarItem(state.modal.itemId, datos);
      }
      return false;
    },

    confirmarAjuste: function (event) {
      event.preventDefault();
      var modal = state.modal;
      var item = state.items.find(function (i) { return i.id === modal.itemId; });
      var cantidad = modal.cantidad;
      if (!cantidad || cantidad <= 0) {
        modal.error = 'La cantidad debe ser mayor que 0.';
        render();
        return false;
      }
      if (modal.modo === 'retirar' && cantidad > item.stock) {
        modal.error = 'No puedes retirar más unidades de las que hay en stock.';
        render();
        return false;
      }
      ajustarStock(modal.itemId, modal.modo === 'retirar' ? -cantidad : cantidad);
      return false;
    },

    confirmarEliminar: function () {
      eliminarItem(state.modal.itemId);
    }
  };

  window.App = App;
  render();
})();
</script>
</body>
</html>
